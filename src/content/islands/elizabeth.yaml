name_fr: "L’île Elizabeth"
name_en: "Elizabeth Island"
kind: island
ocean: antarctique
coords: [-70.0, -57.0]
span: [1578, 1747]
coords_confidence: approximate
coords_note: >-
  Drake, October 1578, at latitude 57 S (Hakluyt: '57 and a terce').
  Longitude unrecorded; Pactolus Bank proposed.
  Unchanged by the October 2026 tracing: the drawing that gives the shape
  carries no position, and no chart of the island is precise enough to
  move it. Nuño da Silva's log has Drake anchor "off an island in 57
  degrees" on 24 October; John Drake's second declaration says 56. The
  island sits 202 km south-west of Cape Horn and 96 km from the Diego
  Ramírez islands, clear of land.
outline_note: >-
  Traced from Francis Fletcher's 'The Description of Elizabeth Iland', a
  drawing from the voyage by Drake's chaplain, in John Conyers' 1677 copy
  (British Library, Sloane MS 61) as reproduced in Nuttall, New Light on
  Drake (Hakluyt Society, 1914), Plate IV. Chosen by Étienne in October
  2026 over Fletcher's own map of the three islands (Plate III, ~60 x 70
  px), Hondius' Drake broadside (~20 x 25 px), the Drake-Mellon map (a
  speck) and Delisle 1703, the story's plate (a stub of coast at the
  neatline) — the discoverers' own drawing, as with Nakanotorishima.
  `--mode ink`, flooded from inside and stopped by the drawn coast, 667 x
  696 px. Turned 180 degrees: the drawing is south-up — its pool is
  labelled "in the south part of the Ile" and drawn at the top, and
  Fletcher's Plate III map is south-up too.
  Liberty: the stream from the pool to the north coast is painted out so
  the pool fills; the atlas draws outer shores, so the pool is land here.
  SIZE IS A CHOICE: no source gives a scale — Conyers notes his copy is
  "Broader & deeper then the Originall", and the printed maps draw a dot.
  48 km, Étienne's choice (October 2026), the "about 30 miles across" of
  Riesenberg's reading of the accounts, which also has a central lake and a
  haven on the east shore. That figure was seen only as English Wikipedia
  reports it, not checked against Fletcher or Hakluyt.
