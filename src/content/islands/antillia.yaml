name_fr: "Antillia"
name_en: "Antillia"
kind: island
ocean: atlantique-nord
coords: [-35.2, 38.5]
span: [1424, 1500]
coords_confidence: approximate
coords_note: >-
  West of the Azores, which is where every account puts it and where the
  Pizzigano chart of 1424 draws it: Antillia sits about 630 km west of the
  islands Pizzigano labels "capraria" and "louo" — medieval names for the
  Azores, which were well known by the 15th century. Anchoring on those and
  using the chart's own scale gives roughly -35, and the literature's "200
  miles west of the Azores" agrees. Latitude is the soft part, 37 to 41
  depending on which real island "capraria" is taken to be.
  Earlier values, both wrong: [-45.0, 32.0], too far out; and [-22.95, 38.14],
  which came from extrapolating a transform fitted only on Madeira, the
  Canaries and Iberia far past its calibration, landing Antillia absurdly
  *east* of the Azores.
outline_note: >-
  Traced from the Albino de Canepa portolan of 1489, at full resolution
  (14383 px wide). Canepa draws Antillia as a golden coast band round a pale
  interior, so it is extracted by thresholding the band and filling, not by
  picking out a colour wash — and the bays need a *square* structuring
  element, because a disk cannot hold a right angle and rounds every notch
  into a wave. All seven small bays survive, four down the east flank and
  three down the west, plus the large arched bay at the south end.
  Supersedes an earlier trace from Pizzigano 1424, whose Antillia is smaller
  on the sheet and partly hidden under the seven cartouches of the Seven
  Cities.
  SCALE IS PROVISIONAL: the height is simply carried over from the Pizzigano
  measurement (593 km), so the width follows from Canepa's aspect ratio and
  comes out at 150 km. Canepa draws the island far more elongated than
  Pizzigano did. Georeference the Canepa chart on its own landmarks to
  replace this with a measured size.
