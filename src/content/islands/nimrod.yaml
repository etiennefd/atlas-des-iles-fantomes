name_fr: "Les îles Nimrod"
name_en: "The Nimrod Islands"
kind: island
ocean: antarctique
coords: [-158.5, -56.5]
span: [1828, 1909]
coords_confidence: attested
coords_note: >-
  56°30' S 158°30' W, where Capt. Henry Eilbeck of the Nimrod placed the
  group in 1828, on passage from Port Jackson to Rio round the Horn
  (Findlay 1851, p. 678, after Horsburgh). Biscoe sought it in 1831 and
  gave 56°03' S 157°50' W; J. K. Davis of a later Nimrod sounded 1140
  fathoms there in 1909 (Geographical Journal 36, 1910, p. 701). Moved
  November 2026 from a rounded -158.0, -56.0.
outline_note: >-
  No depiction with a coastline exists, and no size or count anywhere:
  Eilbeck's "group of islands" was "seen at a considerable distance". The
  shape is BUILT FROM THE REPORT by scripts/describe_island.py, which can
  only take "a group" from it: four islets of 3-6 km spread over 24 km are
  invented. Was a 290 x 257 km blob.
