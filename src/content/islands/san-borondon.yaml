name_fr: "San Borondón"
name_en: "San Borondón"
kind: island
ocean: atlantique-nord
coords: [-19.01, 27.91]
span: [null, 1759]
coords_confidence: attested
coords_note: >-
  The Canarian tradition of Saint Brendan's island: the "eighth Canary",
  seen on the western horizon from La Palma, La Gomera and El Hierro and
  sought by expeditions from the Canaries into the 18th century. Split from
  `saint-brendan` in October 2026 — the northern island of the printed
  atlases and this one are two phantoms sharing a name, some 2,700 km apart,
  and a single entry could only have shown one of them. The span is the one
  the combined entry carried, ending with the 1759 sighting; it belongs to
  this tradition, not the northern one.
  The position is derived, not chosen: the chart that gives the shape draws
  every real Canary beside it. Seven island centroids fit a similarity to
  RMS 14 km at 0.073 km/px, rotation +9.5 degrees (magnetic north), and put
  San Borondón at [-19.01, 27.91], about 85 km west of El Hierro and 1350 px
  inside the surveyed region rather than beyond it. The western five islands
  alone move it by 17 km. Attested in the sense used here: a specific
  charted position, read off the chart.
outline_note: >-
  Traced from 'Plan de las Afortunadas Islas del Reyno de Canarias', a
  manuscript chart of c. 1760 (Ministerio de Defensa, Madrid), 8425 x 6062,
  where 'S. Borondon' is drawn in the same brown wash and relief hatching as
  the real islands. Its title matches Pedro Agustín del Castillo's 1686 map
  and it may copy it; not established. Chosen by Étienne in October 2026
  over Delisle 1707 (the story's plate, a 35 px blob) for the Canarian
  island; Mercator 1569 went to the northern one.
  `--mode dark --threshold 130 --open 9 --closing 30`. A PAPER FOLD crosses
  the lower third: above ~140 it cuts the island and the southern part is
  silently dropped, leaving a straight chord on the crease. --closing 30
  bridges the scuffed paint, adding 0.3% to the area, all inside the drawn
  outline. 21 x 58 km.
