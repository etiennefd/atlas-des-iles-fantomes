coords_note: >-
  Read off the Pizzigano chart of 1424 itself, by georeferencing it on six
  landmarks it also carries — Madeira, Lanzarote, Fuerteventura, Lisbon,
  Sanlúcar, Málaga — which fit to an RMS of 47 km. The chart puts Antillia
  about 1270 km west of Lisbon, near the longitude of the Azores. This
  replaces an earlier [-45.0, 32.0], which was some 1900 km too far west.
  Caveat: the island sits well west of every landmark, so the transform is
  extrapolated there and the position is softer than the 47 km RMS suggests.
outline_note: >-
  Traced from the Pizzigano chart of 1424 — the first to name Antillia, and
  the depiction later cartographers copied: Beccario 1435, Bianco 1436,
  Pareto 1455, Benincasa, Roselli. An elongated mass canted NE-SW, deeply
  bayed, carrying the seven cartouches of the Seven Cities. Those cartouches
  are filled as land when tracing: they are labels written on the island,
  not lakes. 340 x 593 km by the chart's own scale, which matches the
  contemporary description of it as being on a similar scale to Portugal.
