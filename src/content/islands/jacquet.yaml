name_fr: "L’île Jacquet"
name_en: "Jacquet Island"
kind: reef
ocean: atlantique-nord
coords: [-39.5, 46.917]
# First report 1728 as the story's notice gives it: unconfirmed, but nothing
# contradicts it — Bowles' map of 1779 (the story's plate) already carries it,
# and Purdy says it had been dropped and restored before 1836. Off the charts
# in the 1850s, as the notice says, after Berryman's 1856 cable soundings
# (Blunt 1868: "does not exist"). Was [1836, 1900], the Seaflower sighting to
# nothing in particular.
span: [1728, 1856]
coords_confidence: attested
coords_note: >-
  46°55' N 39°30' W, as Purdy's Memoir on the Atlantic gives it (1840,
  pp. 434-435), restored to the charts after a reported sighting in 1789.
  The brig Seaflower of Jersey saw it at 5 a.m. on 25 April 1836, by dead
  reckoning in about 46°53' N 39°29' W: "half a mile in length, and about
  300 feet ... high", rocks a cable's length off its SSE cape. Its mate
  Thomas Le Gros sketched its profile, now lost; John Scott of Jersey sent
  the account to Norie (Nautical Magazine 1838, p. 366). Blunt's Memoir of
  1868: "does not exist". Moved November 2026 from -43.0, 47.0, which
  traces to a New York Times piece of 1904 and Wikipedia, ~265 km west of
  every primary source. Half a mile long, it is drawn as a reef.
outline_note: >-
  No depiction with a coastline was found; Le Gros' sketch of its profile
  (1836) is lost. Half a mile long, it is drawn as a reef: the same rock
  cluster, a ~60 km stand-in for something too small to see, so at full
  zoom it looks larger than 30-mile Emerald. A true 1 km islet, a dot in
  its halo like Bermeja, was the alternative. Was a 227 x 318 km blob.
